name: CI/CD

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: roshand22/k8s-cicd-demo

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${GITHUB_SHA} ./app
          docker tag $IMAGE_NAME:${GITHUB_SHA} $IMAGE_NAME:latest

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${GITHUB_SHA}
          docker push $IMAGE_NAME:latest

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -k k8s/
          kubectl -n k8s-cicd-demo set image deployment/backend \
            backend=$IMAGE_NAME:${GITHUB_SHA}
          kubectl -n k8s-cicd-demo rollout status deployment/backend \
            --timeout=120s
